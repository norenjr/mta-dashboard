name: Fetch daily tweet

# @nymetrowx posts once daily around 5am ET. Runs at 12:15 UTC
# (7:15am EDT / 8:15am EST — drifts ~1hr across DST, which is fine
# for a once-daily check) and can also be run manually to test.
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest tweet
        run: node scripts/fetch-tweet.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweet.json
          git diff --cached --quiet || git commit -m "Update daily tweet"
          git push
